            <!-- Target Website (Hidden on Facebook) -->
            <div class="form-group" id="target-site-group">
                <div class="flex-between">
                    <label>Target Website</label>
                    <span id="add-website" class="add-text">
                        <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        Add Custom
                    </span>
                </div>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>

                        <option value="www.twitter.com">www.twitter.com</option>
                        <option value="www.linkedin.com">www.linkedin.com</option>
                        <option value="www.instagram.com">www.instagram.com</option>

            <!-- Keyword & Location -->
            <div class="form-group row-align-fields">
                <div class="field-half">
                    <label>Keyword</label>
                    <input type="text" id="keyword" class="input-element" value="real estate">
                </div>
                <div class="field-half">
                    <label>Location</label>
                    <input type="text" id="location" class="input-element" placeholder="e.g. Dubai">
                </div>
            </div>

            <!-- Pages / Scrolls -->
            <div class="form-group row-align">
                <label id="pages-label">Pages / Scrolls</label>
                <div class="counter">
                    <button id="page-minus" class="counter-btn">-</button>
                    <input type="number" id="search-pages" value="10" min="1" max="100">
                    <button id="page-plus" class="counter-btn">+</button>
                </div>
            </div>
        </div>

        <!-- Action Controls -->
        <div class="btn-group">

                <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <span class="btn-text">Start Search</span>
            </button>
            <button id="btn-resume" class="btn-main btn-resume hidden" style="background: #ff9800; border-color: #f57c00;">
                <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                <span class="btn-text">Resume</span>
            </button>
            <button id="btn-stop" class="btn-main btn-stop">
                <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2" ry="2"></rect></svg>
                <span class="btn-text">Stop</span>
            </button>
        </div>

        <!-- Results Card -->
        <div class="card results-card">
            <div class="flex-between results-header">
                <span class="result-badge">Results: <strong id="result-count">0</strong></span>
                <span id="status-collecting" class="collecting-text hidden">
                    <span class="spinner"></span> Collecting <span id="page-progress"></span>
                </span>
            </div>
            
            <textarea id="result-text" class="result-textarea" readonly placeholder="Scraped links will appear here..."></textarea>
            
            <div class="action-btns">

                    <span class="btn-text">Copy</span>
                </button>
                <button id="btn-export" class="btn-utility" title="Export to Excel (CSV)">
                    <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="8" y1="13" x2="16" y2="13"></line><line x1="8" y1="17" x2="16" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                    <span>Excel</span>
                </button>
                <button id="btn-export-txt" class="btn-utility" title="Export to Text (TXT)">
                    <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                    <span>TXT</span>
                </button>
                <button id="btn-open-links" class="btn-utility" title="Open All Links in New Tabs">
                    <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                    <span>Open Links</span>
                </button>
                <button id="btn-clear" class="btn-utility btn-clear" title="Clear Results">
                    <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                    <span>Clear</span>
                </button>
            </div>
        </div>
        </div>

        <!-- TAB: WA WEB SCRAPER -->
        <div id="tab-web" class="tab-content">
            <div class="card" style="text-align: center; padding: 30px 16px;">
                <svg viewBox="0 0 24 24" width="48" height="48" stroke="var(--wa-green)" stroke-width="1.5" fill="none" style="margin-bottom: 16px;">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M16 16v-3a2 2 0 0 0-4 0"></path>
                    <path d="M8 12h.01"></path>
                    <path d="M12 12h.01"></path>
                    <path d="M16 12h.01"></path>
                </svg>
                <h3 style="margin-bottom: 12px; color: var(--text-main);">Extract Group Members</h3>
                <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 24px; line-height: 1.5;">
                    1. Open <strong>web.whatsapp.com</strong><br>
                    2. Open a group chat & click the group name to view members<br>
                    3. Click the button below to inject the scraper.
                </p>
                <button id="btn-inject-wa" class="btn-main btn-search" style="width: 100%;">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
                    <span class="btn-text">Inject WA Scraper</span>
                </button>
            </div>
        </div>
